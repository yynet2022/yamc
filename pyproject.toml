[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yamc"
dynamic = ["version"]
description = "Yet Another Markdown Converter"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Author", email = "author@example.com" }]
dependencies = [
    "typer",
    "markdown",
    "mistune",
    "markdown-it-py",
    "markdown2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
yamc = "yamc:main"

[tool.hatch.version]
path = "src/yamc/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/yamc"]

[tool.ruff]
line-length = 79
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "D203", # 1 blank line required before class docstring (conflicts with D211)
    "D213", # Multi-line docstring summary should start at the second line (conflicts with D212)
    "D400", # First line should end with a period (incompatible with Japanese)
    "D415", # First line should end with a period (incompatible with Japanese)
    "RUF001", # Ambiguous characters in docstrings/strings (Japanese punctuation)
    "RUF003", # Ambiguous characters in comments (Japanese comments)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --color=no --cov=src --cov-branch --cov-report=term-missing"
